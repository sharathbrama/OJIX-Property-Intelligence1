# Dedicated public demo API template. Deploy separately from apps/api/cloudrun.service.yaml.
# Point DATABASE_URL and GCS_BUCKET only at resources created for synthetic demo data.
# The database credential must have grants only on ojix_property_demo.
# Do not bind this service to the production database, production storage, SMTP, or OCR worker.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ojix-demo-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: "2"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/network-interfaces: '[{"network":"REPLACE_WITH_VPC_NETWORK_NAME","subnetwork":"REPLACE_WITH_VPC_SUBNET_NAME"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 20
      serviceAccountName: REPLACE_WITH_DEMO_API_RUNTIME_SERVICE_ACCOUNT
      containers:
        - image: REPLACE_WITH_REGION_DOCKER_PKG_DEV_PROJECT_REPOSITORY_OJIX_API_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: CORS_ORIGIN
              value: REPLACE_WITH_EXACT_HTTPS_FRONTEND_ORIGIN
            - name: PUBLIC_DEMO_LOGIN_ENABLED
              value: "true"
            - name: PUBLIC_DEMO_TENANT_ID
              value: "11111111-1111-4111-8111-111111111111"
            - name: PUBLIC_DEMO_DATABASE_NAME
              value: ojix_property_demo
            - name: PUBLIC_DEMO_SESSION_TTL_HOURS
              value: "8"
            - name: DATABASE_SSL
              value: "true"
            - name: DATABASE_SSL_CA
              value: /var/run/secrets/mysql/server-ca.pem
            - name: DB_POOL_LIMIT
              value: "8"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_DEMO_DATABASE_URL_SECRET_NAME
                  key: latest
            - name: DOCUMENT_STORAGE_PROVIDER
              value: gcs
            - name: GCS_BUCKET
              value: REPLACE_WITH_PRIVATE_DEMO_ONLY_GCS_BUCKET
            - name: UPLOAD_DIR
              value: /tmp/ojix-demo-uploads
          volumeMounts:
            - name: mysql-ca
              mountPath: /var/run/secrets/mysql
              readOnly: true
      volumes:
        - name: mysql-ca
          secret:
            secretName: REPLACE_WITH_CLOUD_SQL_CA_SECRET_NAME
            items:
              - key: latest
                path: server-ca.pem
