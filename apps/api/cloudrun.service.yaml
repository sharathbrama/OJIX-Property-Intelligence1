# Preparation template only. Replace every REPLACE_* placeholder after approval.
# This file does not create a Cloud Run service until explicitly applied.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ojix-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: "3"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/network-interfaces: '[{"network":"REPLACE_WITH_VPC_NETWORK_NAME","subnetwork":"REPLACE_WITH_VPC_SUBNET_NAME"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 20
      serviceAccountName: REPLACE_WITH_API_RUNTIME_SERVICE_ACCOUNT
      containers:
        - image: REPLACE_WITH_REGION_DOCKER_PKG_DEV_PROJECT_REPOSITORY_OJIX_API_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: CORS_ORIGIN
              value: REPLACE_WITH_EXACT_HTTPS_FRONTEND_ORIGIN
            - name: FIREBASE_PROJECT_ID
              value: ojix-property-intelligence
            - name: PUBLIC_DEMO_LOGIN_ENABLED
              value: "false"
            - name: PUBLIC_DEMO_TENANT_ID
              value: "REPLACE_WITH_ISOLATED_PUBLIC_DEMO_TENANT_ID"
            - name: DATABASE_SSL
              value: "true"
            - name: DATABASE_SSL_CA
              value: /var/run/secrets/mysql/server-ca.pem
            - name: DB_POOL_LIMIT
              value: "8"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_DATABASE_URL_SECRET_NAME
                  key: latest
            - name: DOCUMENT_STORAGE_PROVIDER
              value: gcs
            - name: GCS_BUCKET
              value: REPLACE_WITH_PRIVATE_GCS_BUCKET_NAME
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_SMTP_USER_SECRET_NAME
                  key: latest
            - name: SMTP_HOST
              value: REPLACE_WITH_APPROVED_SMTP_HOST
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_SMTP_PASS_SECRET_NAME
                  key: latest
            - name: OCR_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_OCR_WORKER_TOKEN_SECRET_NAME
                  key: latest
          volumeMounts:
            - name: mysql-ca
              mountPath: /var/run/secrets/mysql
              readOnly: true
      volumes:
        - name: mysql-ca
          secret:
            secretName: REPLACE_WITH_CLOUD_SQL_CA_SECRET_NAME
            items:
              - key: latest
                path: server-ca.pem
