services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ojix_property_mysql
      MARIADB_USER: ojix
      MARIADB_PASSWORD: ojix_local_only
      MARIADB_ROOT_PASSWORD: root_local_only
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - ojix_db_data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - ojix_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ojix-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: mysql://ojix:ojix_local_only@db:3306/ojix_property_mysql
      CORS_ORIGIN: "http://localhost:5173,http://localhost:8080,http://web:8080"
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:-}
      DEMO_OTP_EMAIL: ${DEMO_OTP_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      DEMO_OTP_PHONE: ${DEMO_OTP_PHONE:-}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 25
      OCR_LANGUAGES: kan+eng
      OCR_MAX_PAGES: 5
      OCR_TIMEOUT_MS: 120000
    ports:
      - "${API_PORT:-4001}:4000"
    volumes:
      - ojix_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ojix_net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ojix-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ojix_net

volumes:
  ojix_db_data:
  ojix_uploads:

networks:
  ojix_net:
    driver: bridge
