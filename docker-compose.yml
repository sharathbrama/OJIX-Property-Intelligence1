services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ojix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ojix_property
      POSTGRES_USER: ojix
      POSTGRES_PASSWORD: ojix_local_only
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ojix_pgdata:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./infra/db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojix -d ojix_property"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ojix_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ojix-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://ojix:ojix_local_only@db:5432/ojix_property
      CORS_ORIGIN: "http://localhost:5173,http://localhost:8080,http://web:8080"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 25
    ports:
      - "4000:4000"
    volumes:
      - ojix_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ojix_net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ojix-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ojix_net

volumes:
  ojix_pgdata:
  ojix_uploads:

networks:
  ojix_net:
    driver: bridge
