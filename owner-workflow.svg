<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OJIX Workspace Owner workflow</title>
  <desc id="desc">The Owner tracks matters, assigns tasks, monitors progress, follows up on blockers, and shares reports after qualified reviewer approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#edf6f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173454" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#7292ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 39px Arial,sans-serif;fill:#142a43}.sub{font:400 17px Arial,sans-serif;fill:#6b7e91}.step{font:700 18px Arial,sans-serif;fill:#18334f}.copy{font:400 14px Arial,sans-serif;fill:#62758a}.num{font:700 13px Arial,sans-serif;fill:#fff}.tag{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#287c79}.footer{font:700 16px Arial,sans-serif;fill:#244663}.loop{font:700 12px Arial,sans-serif;fill:#a36525}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1500" cy="90" r="170" fill="#dceeea" opacity=".6"/><circle cx="80" cy="820" r="180" fill="#e3ecfa" opacity=".65"/>
  <text x="100" y="105" class="tag">OJIX PROPERTY INTELLIGENCE</text>
  <text x="100" y="160" class="title">Workspace Owner — Work Flow</text>
  <text x="100" y="195" class="sub">Coordinate delivery across matters, tasks, review and reporting.</text>

  <!-- connectors -->
  <path d="M325 405 H365" stroke="#7292ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M565 405 H605" stroke="#7292ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M805 405 H845" stroke="#7292ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1045 405 H1085" stroke="#7292ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1285 405 H1325" stroke="#7292ad" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="305" width="225" height="200" rx="18" fill="#fff" stroke="#dce6ef"/>
    <rect x="365" y="305" width="200" height="200" rx="18" fill="#fff" stroke="#dce6ef"/>
    <rect x="605" y="305" width="200" height="200" rx="18" fill="#fff" stroke="#dce6ef"/>
    <rect x="845" y="305" width="200" height="200" rx="18" fill="#fff" stroke="#dce6ef"/>
    <rect x="1085" y="305" width="200" height="200" rx="18" fill="#f0f8f6" stroke="#add7cc" stroke-width="2"/>
    <rect x="1325" y="305" width="200" height="200" rx="18" fill="#fff" stroke="#dce6ef"/>
  </g>
  <g>
    <circle cx="135" cy="344" r="17" fill="#27558a"/><text x="135" y="349" text-anchor="middle" class="num">1</text>
    <text x="125" y="390" class="step">Portfolio overview</text><text x="125" y="425" class="copy"><tspan x="125">Track active matters</tspan><tspan x="125" dy="21">and current status.</tspan></text>
    <circle cx="400" cy="344" r="17" fill="#27558a"/><text x="400" y="349" text-anchor="middle" class="num">2</text>
    <text x="390" y="390" class="step">Assign work</text><text x="390" y="425" class="copy"><tspan x="390">Allocate matters and</tspan><tspan x="390" dy="21">tasks to the team.</tspan></text>
    <circle cx="640" cy="344" r="17" fill="#27558a"/><text x="640" y="349" text-anchor="middle" class="num">3</text>
    <text x="630" y="390" class="step">Monitor progress</text><text x="630" y="425" class="copy"><tspan x="630">Open tasks, overdue</tspan><tspan x="630" dy="21">items and reports due.</tspan></text>
    <circle cx="880" cy="344" r="17" fill="#27558a"/><text x="880" y="349" text-anchor="middle" class="num">4</text>
    <text x="870" y="390" class="step">Review blockers</text><text x="870" y="425" class="copy"><tspan x="870">Check evidence gaps</tspan><tspan x="870" dy="21">and pending review.</tspan></text>
    <circle cx="1120" cy="344" r="17" fill="#208878"/><text x="1120" y="349" text-anchor="middle" class="num">5</text>
    <text x="1110" y="390" class="step">Qualified reviewer</text><text x="1110" y="425" class="copy"><tspan x="1110">Reviews evidence and</tspan><tspan x="1110" dy="21">approves conclusions.</tspan></text>
    <circle cx="1360" cy="344" r="17" fill="#27558a"/><text x="1360" y="349" text-anchor="middle" class="num">6</text>
    <text x="1350" y="390" class="step">Share report</text><text x="1350" y="425" class="copy"><tspan x="1350">Export the approved</tspan><tspan x="1350" dy="21">client-ready report.</tspan></text>
  </g>

  <!-- follow-up loop -->
  <path d="M945 520 V630 Q945 665 910 665 H480 Q445 665 445 630 V520" fill="none" stroke="#d89a4c" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <rect x="580" y="642" width="260" height="42" rx="21" fill="#fff6e9" stroke="#f1d5ae"/>
  <text x="710" y="668" text-anchor="middle" class="loop">If blocked: follow up or reassign</text>

  <rect x="100" y="755" width="1425" height="74" rx="15" fill="#e6f2f0" stroke="#c6e0db"/>
  <circle cx="139" cy="792" r="15" fill="#208878"/><path d="m132 792 5 5 10-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="798" class="footer">Owner coordinates delivery. The qualified reviewer is responsible for legal sign-off.</text>
</svg>
